<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPy Canvas | Contato & CV</title>
    <style>
        /* CSS Puro Corrigido e Validado */
        body { 
            background-color: #0b0f19; 
            color: #f1f5f9; 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }
        /* Pontos de Luz corrigidos (removido espaços) */
        body::before {
            content: ""; 
            position: absolute; 
            top: -20%; 
            left: -10%; 
            width: 600px; 
            height: 600px; 
            background: rgba(245, 158, 11, 0.06); 
            border-radius: 50%; 
            filter: blur(120px); 
            pointer-events: none; 
            z-index: 1;
        }
        body::after {
            content: ""; 
            position: absolute; 
            bottom: -10%; 
            right: -10%; 
            width: 500px; 
            height: 500px; 
            background: rgba(16, 185, 129, 0.05); 
            border-radius: 50%; 
            filter: blur(120px); 
            pointer-events: none; 
            z-index: 1;
        }
        .container { 
            max-width: 40rem; 
            width: 100%; 
            margin: 0 auto; 
            position: relative; 
            z-index: 10; 
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            padding-bottom: 1.5rem; 
            margin-bottom: 2rem; 
        }
        h1 { 
            margin: 0; 
            font-size: 1.75rem; 
            color: #f59e0b; 
            font-weight: 800; 
            letter-spacing: -0.025em; 
        }
        
        .glass-box { 
            background: rgba(30, 41, 59, 0.45); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 2.25rem; 
            border-radius: 1.25rem; 
            margin-bottom: 1.5rem; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }
        
        .form-group { margin-bottom: 1.5rem; }
        label { 
            display: block; 
            font-size: 0.75rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            margin-bottom: 0.5rem; 
            color: #94a3b8; 
        }
        
        input, textarea { 
            width: 100%; 
            padding: 0.85rem 1rem; 
            background-color: #0e1422; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 0.75rem; 
            color: white; 
            box-sizing: border-box; 
            font-family: inherit; 
            font-size: 0.95rem; 
            transition: all 0.2s; 
        }
        input:focus, textarea:focus { 
            outline: none; 
            border-color: rgba(245, 158, 11, 0.5); 
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.15); 
        }
        textarea { resize: vertical; min-height: 130px; }
        
        .btn-submit { 
            background-color: #f59e0b; 
            color: #0f172a; 
            border: none; 
            width: 100%; 
            padding: 1rem; 
            border-radius: 0.75rem; 
            font-weight: 700; 
            font-size: 0.875rem; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            cursor: pointer; 
            transition: all 0.2s; 
            box-shadow: 0 10px 15px -3px rgba(245, 158, 11, 0.15); 
        }
        .btn-submit:hover { background-color: #d97706; }
        .btn-submit:disabled { background-color: rgba(245, 158, 11, 0.4); cursor: not-allowed; }
        
        .btn-download { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 0.5rem; 
            background-color: #10b981; 
            color: white; 
            padding: 1rem; 
            border-radius: 0.75rem; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 0.875rem; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            margin-bottom: 1.5rem; 
            transition: all 0.2s; 
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.15); 
        }
        .btn-download:hover { background-color: #059669; transform: translateY(-1px); }
        
        .btn-back { 
            background-color: rgba(255, 255, 255, 0.05); 
            color: #e2e8f0; 
            text-decoration: none; 
            padding: 0.5rem 1rem; 
            border-radius: 0.75rem; 
            font-size: 0.75rem; 
            font-weight: 600; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            transition: all 0.2s; 
        }
        .btn-back:hover { background-color: rgba(255, 255, 255, 0.1); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Contato & Currículo 💼</h1>
            <a href="/" class="btn-back">← Voltar</a>
        </div>
        <div class="glass-box" style="text-align: center;">
            <h2 style="margin-top: 0; font-size: 1.25rem; color: white; font-weight: 700;">Baixar Currículo Profissional</h2>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.75rem; line-height: 1.5;">Clique no botão abaixo para fazer o download do meu CV completo formatado de acordo com as diretrizes da EBAC.</p>
            <a href="/api/contato/download-cv" class="btn-download" download>📥 Baixar meu CV (PDF Oficial)</a>
        </div>
        <div class="glass-box">
            <h2 style="margin-top: 0; font-size: 1.25rem; color: white; font-weight: 700; margin-bottom: 1.5rem;">Envie uma Mensagem</h2>
            <form id="form-contato" onsubmit="enviarMensagem(event)">
                <div class="form-group">
                    <label for="nome">Seu Nome / Empresa</label>
                    <input type="text" id="nome" required placeholder="Ex: Recrutador Tech">
                </div>
                <div class="form-group">
                    <label for="email">Seu E-mail de Contato</label>
                    <input type="email" id="email" required placeholder="recrutador@empresa.com">
                </div>
                <div class="form-group">
                    <label for="mensagem">Mensagem</label>
                    <textarea id="mensagem" required placeholder="Olá! Gostei do seu portfólio e gostaria de marcar uma entrevista..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Enviar Mensagem Full Stack</button>
            </form>
        </div>
    </div>
    <script>
        async function enviarMensagem(event) {
            event.preventDefault();
            const btn = document.querySelector('.btn-submit');
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const mensagem = document.getElementById('mensagem').value;
            btn.innerText = "Processando no Servidor...";
            btn.disabled = true;
            try {
                const response = await fetch('/api/contato/enviar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, mensagem })
                });
                if (!response.ok) throw new Error();
                alert("Mensagem armazenada com sucesso no banco relacional! Obrigado pelo contato.");
                document.getElementById('form-contato').reset();
            } catch (error) {
                alert("Erro crítico ao transmitir dados para o servidor Python.");
            } finally {
                btn.innerText = "Enviar Mensagem Full Stack";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
