<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPy Canvas | Autenticação</title>
    <style>
        body { background-color: #111827; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-container { background-color: #1f2937; padding: 2.5rem; border-radius: 0.75rem; border: 1px solid #374151; width: 100%; max-width: 400px; box-sizing: border-box; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        .logo { font-size: 1.5rem; font-weight: 700; color: #f59e0b; text-align: center; margin-bottom: 2rem; }
        .logo span { color: #ffffff; font-weight: 300; }
        .tabs { display: flex; border-bottom: 2px solid #374151; margin-bottom: 1.5rem; }
        .tab { flex: 1; text-align: center; padding: 0.75rem 0; cursor: pointer; color: #9ca3af; font-weight: 600; font-size: 0.95rem; }
        .tab.active { color: #f59e0b; border-bottom: 2px solid #f59e0b; margin-bottom: -2px; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.875rem; margin-bottom: 0.5rem; color: #9ca3af; }
        input { width: 100%; padding: 0.75rem; background-color: #111827; border: 1px solid #374151; border-radius: 0.375rem; color: white; box-sizing: border-box; font-size: 1rem; }
        input:focus { border-color: #f59e0b; outline: none; }
        .btn-auth { background-color: #f59e0b; color: #111827; border: none; width: 100%; padding: 0.75rem; border-radius: 0.375rem; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 1rem; transition: background-color 0.2s; }
        .btn-auth:hover { background-color: #d97706; }
        .mensagem { font-size: 0.875rem; text-align: center; margin-top: 1rem; display: none; }
        .mensagem.sucesso { color: #34d399; }
        .mensagem.erro { color: #f87171; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo">DevPy<span>Canvas</span></div>
        
        <!-- Abas de alternância -->
        <div class="tabs">
            <div id="tab-login" class="tab active" onclick="alternarAba('login')">Login</div>
            <div id="tab-cadastro" class="tab" onclick="alternarAba('cadastro')">Cadastro</div>
        </div>

        <!-- Formulário de Login -->
        <form id="form-login" onsubmit="executarLogin(event)">
            <div class="form-group">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" required placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label for="login-senha">Senha</label>
                <input type="password" id="login-senha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-auth">Entrar no Sistema</button>
        </form>

        <!-- Formulário de Cadastro -->
        <form id="form-cadastro" class="hidden" onsubmit="executarCadastro(event)">
            <div class="form-group">
                <label for="cad-nome">Nome Completo</label>
                <input type="text" id="cad-nome" placeholder="Ex: Jonas Eduardo">
            </div>
            <div class="form-group">
                <label for="cad-email">E-mail</label>
                <input type="email" id="cad-email" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label for="cad-senha">Senha</label>
                <input type="password" id="cad-senha" placeholder="Crie uma senha forte">
            </div>
            <button type="submit" class="btn-auth">Criar Minha Conta</button>
        </form>

        <div id="msg-feedback" class="mensagem"></div>
    </div>

    <script>
        function alternarAba(tipo) {
            const formLogin = document.getElementById('form-login');
            const formCadastro = document.getElementById('form-cadastro');
            const tabLogin = document.getElementById('tab-login');
            const tabCadastro = document.getElementById('tab-cadastro');
            const msg = document.getElementById('msg-feedback');
            
            msg.style.display = 'none';

            if (tipo === 'login') {
                formLogin.classList.remove('hidden');
                formCadastro.classList.add('hidden');
                tabLogin.classList.add('active');
                tabCadastro.classList.remove('active');
            } else {
                formLogin.classList.add('hidden');
                formCadastro.classList.remove('hidden');
                tabLogin.classList.remove('active');
                tabCadastro.classList.add('active');
            }
        }

        function exibirFeedback(texto, estilo) {
            const msg = document.getElementById('msg-feedback');
            msg.innerText = texto;
            msg.className = `mensagem ${estilo}`;
            msg.style.display = 'block';
        }

        async function executarCadastro(event) {
            event.preventDefault();
            const nome = document.getElementById('cad-nome').value;
            const email = document.getElementById('cad-email').value;
            const senha = document.getElementById('cad-senha').value;

            try {
                const response = await fetch('/api/auth/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha_criptografada: senha })
                });

                const dados = await response.json();

                if (!response.ok) {
                    throw new Error(dados.detail || "Erro ao realizar o cadastro.");
                }

                exibirFeedback("Conta criada com sucesso! Faça login.", "sucesso");
                setTimeout(() => alternarAba('login'), 2000);

            } catch (error) {
                exibirFeedback(error.message, "erro");
            }
        }

        async function executarLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const dados = await response.json();

                if (!response.ok) {
                    throw new Error(dados.detail || "E-mail ou senha incorretos.");
                }

                // Salva os dados da sessão no navegador do usuário
                localStorage.setItem('token_acesso', dados.access_token);
                localStorage.setItem('usuario_nome', dados.nome);
                localStorage.setItem('usuario_id', dados.usuario_id || 1);

                exibirFeedback("Autenticado com sucesso! Redirecionando...", "sucesso");
                
                // Redireciona o usuário para o Dashboard privado
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1500);

            } catch (error) {
                exibirFeedback(error.message, "erro");
            }
        }
    </script>
</body>
</html>
